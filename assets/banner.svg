<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
      
      /* Animated Elements */
      @keyframes pulse-scan {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(220px); opacity: 0.8; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes float-node {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -40; }
      }
      
      .scan-line { animation: pulse-scan 6s ease-in-out infinite; }
      .floating-card-1 { animation: float-node 4s ease-in-out infinite; }
      .floating-card-2 { animation: float-node 5s ease-in-out infinite 1s; }
      .flow-line { stroke-dasharray: 8, 8; animation: dash-flow 3s linear infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Dynamic Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Right Side Background Animated Visual Workflow (Kept in Background behind Layering) -->
  <g opacity="0.65" transform="translate(680, 40)">
    <!-- Flow Connectors -->
    <path d="M 90 70 L 210 70 M 290 70 L 410 70" stroke="#3b82f6" stroke-width="2" class="flow-line"/>
    <path d="M 250 110 L 250 170 L 410 170" stroke="#8b5cf6" stroke-width="2" class="flow-line"/>

    <!-- Dynamic Scanning Line -->
    <line x1="0" y1="10" x2="480" y2="10" stroke="#06b6d4" stroke-width="3" filter="url(#glow)" class="scan-line"/>

    <!-- Workflow Nodes / Cards (Decorative) -->
    <!-- Node 1: Doc Verification -->
    <g class="floating-card-1" transform="translate(10, 35)">
      <rect width="80" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="25" y="15" width="30" height="20" rx="3" fill="#334155"/>
      <circle cx="40" cy="22" r="5" fill="#38bdf8"/>
      <line x1="20" y1="46" x2="60" y2="46" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="20" y1="54" x2="45" y2="54" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Node 2: Biometric Liveness -->
    <g class="floating-card-2" transform="translate(210, 35)">
      <rect width="80" height="70" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="40" cy="30" r="14" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2"/>
      <circle cx="40" cy="28" r="6" fill="#c084fc"/>
      <path d="M 26 54 Q 40 44 54 54" fill="none" stroke="#a855f7" stroke-width="2"/>
    </g>

    <!-- Node 3: Orchestration Engine -->
    <g class="floating-card-1" transform="translate(390, 35)">
      <rect width="80" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <path d="M 40 18 L 55 27 L 55 45 L 40 54 L 25 45 L 25 27 Z" fill="none" stroke="#10b981" stroke-width="2"/>
      <circle cx="40" cy="36" r="4" fill="#34d399"/>
    </g>
  </g>

  <!-- Left Content Overlay (Ensures Title & Subtitle sit securely in foreground) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill / Tag -->
    <g transform="translate(0, 50)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#10b981"/>
      <text x="28" y="20" class="badge-text">IDENTITY &amp; KYC ORCHESTRATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Identity Verification</text>
    
    <!-- Title Gradient Accent Bar -->
    <rect x="0" y="145" width="540" height="5" rx="2.5" fill="url(#primary-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Curated Ecosystem of IDV Orchestration Platforms, Biometrics,</text>
    <text x="0" y="210" class="subtitle">Document Verification, Liveness Detection &amp; Compliance Engines.</text>

    <!-- Bottom Tech Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="90" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="45" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#9ca3af" text-anchor="middle">SaaS IDV</text>

      <!-- Pill 2 -->
      <rect x="100" y="0" width="110" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="155" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#9ca3af" text-anchor="middle">Open-Source</text>

      <!-- Pill 3 -->
      <rect x="220" y="0" width="120" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="280" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#9ca3af" text-anchor="middle">KYC / AML / KYB</text>

      <!-- Pill 4 -->
      <rect x="350" y="0" width="110" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="405" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#9ca3af" text-anchor="middle">Biometrics</text>
    </g>
  </g>
</svg>
